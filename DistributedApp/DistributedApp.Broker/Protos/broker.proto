syntax = "proto3";

package distributedapp.broker.v1;
option csharp_namespace = "DistributedApp.Broker.Grpc.V1";

// Contract v1: numerele câmpurilor existente nu se reutilizează la evoluția contractului.
service BrokerRpcV1 {
  // Producerul trimite un mesaj; Brokerul îl salvează o singură dată după message_id.
  rpc Publish (PublishRequest) returns (PublishReply);

  // Producerul verifică dacă mesajul a fost salvat când răspunsul Publish s-a pierdut.
  rpc GetPublishStatus (PublishStatusRequest) returns (PublishStatusReply);

  // Primul eveniment confirmă abonarea; următoarele conțin livrările.
  rpc SubscribeConsumer (SubscribeConsumerRequest) returns (stream ConsumerEvent);

  // Consumerul confirmă sau respinge o livrare folosind sesiunea primită la abonare.
  rpc AcknowledgeDelivery (DeliveryAckRequest) returns (DeliveryAckReply);
}

message PublishRequest {
  string request_id = 1;
  string message_id = 2;
  string correlation_id = 3;
  string message_type = 4;
  string schema_version = 5;
  string occurred_at_utc = 6;
  string topic = 7;
  string payload = 8;
  string sender_id = 9;
}

message PublishReply {
  string request_id = 1;
  string message_id = 2;
  string correlation_id = 3;
  bool accepted = 4;
  bool duplicate = 5;
  string status = 6;
  string schema_version = 7;
}

message PublishStatusRequest { string message_id = 1; }
message PublishStatusReply {
  string message_id = 1;
  bool found = 2;
  string status = 3;
  string schema_version = 4;
}

message SubscribeConsumerRequest {
  string request_id = 1;
  string consumer_id = 2;
  string topic = 3;
  string schema_version = 4;
}

message ConsumerEvent {
  // Un eveniment este ori confirmarea abonării, ori o livrare.
  oneof event {
    SubscriptionAccepted subscribed = 1;
    DeliveryMessage delivery = 2;
  }
}

message SubscriptionAccepted {
  string request_id = 1;
  string session_id = 2;
  string schema_version = 3;
}

message DeliveryMessage {
  string message_id = 1;
  string correlation_id = 2;
  string sender_id = 3;
  string topic = 4;
  string payload = 5;
  string schema_version = 6;
}

message DeliveryAckRequest {
  string request_id = 1;
  string message_id = 2;
  string correlation_id = 3;
  string consumer_id = 4;
  string session_id = 5;
  bool accepted = 6;
  string reason = 7;
  string schema_version = 8;
}

message DeliveryAckReply {
  // Un apel reușit înseamnă că răspunsul a fost înregistrat; duplicate indică un ACK deja salvat.
  bool duplicate = 1;
  string schema_version = 2;
}
